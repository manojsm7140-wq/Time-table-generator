{% extends 'base.html' %}
{% block auth_content %}
<div style="min-height:100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="width:100%; max-width:480px;">
    <div style="text-align:center; margin-bottom:24px;">
      <h2 style="font-family:'Syne',sans-serif; font-weight:800; color:#e2e8f0;">Create Account</h2>
      <p style="color:#94a3b8; font-size:0.875rem;">JSS College Timetable System</p>
    </div>
    <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:32px;">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} mb-3">{{ message }}</div>
      {% endfor %}
      <form method="post">
        {% csrf_token %}
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label">First Name</label>
            <input type="text" name="first_name" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Last Name</label>
            <input type="text" name="last_name" class="form-control" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Role</label>
          <select name="role" class="form-select">
            <option value="student">Student</option>
            <option value="staff">Staff</option>
          </select>
        </div>
        <button type="submit" class="btn-accent w-100" style="padding:12px;">Register</button>
      </form>
      <p style="text-align:center; color:#94a3b8; font-size:0.8rem; margin-top:16px;">
        Already have an account? <a href="{% url 'accounts:login' %}" style="color:#e94560; text-decoration:none;">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
